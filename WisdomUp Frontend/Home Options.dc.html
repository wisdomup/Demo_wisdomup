<x-dc>
<helmet>

<section data-screen-label="Turn 1 — Home" style="padding: 64px; display: flex; flex-direction: column; gap: 32px;">

    <div style="font: 400 16px/1.5 Inter, sans-serif; color: #464646;"><a href="#1a">1a</a> product-led storefront · <a href="#1b">1b</a> editorial, campaign-led</div>
  </div>

    <div id="1a" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="padding: 6px 12px; border-radius: 999px; background: #464646; color: #fff; font: 700 14px/1 Inter, sans-serif;">1a</span>
        <span style="font: 600 16px/1 Inter, sans-serif;">Product-led storefront — rails, tabs, deals, FAQ</span>
      </div>
      <div style="width: 1440px; transform: translateZ(0); border-radius: 12px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.07);">
        <dc-import name="HomeStorefront" hint-size="1440px,4200px"></dc-import>
      </div>
    </div>
    <div id="1b" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="padding: 6px 12px; border-radius: 999px; background: #464646; color: #fff; font: 700 14px/1 Inter, sans-serif;">1b</span>
        <span style="font: 600 16px/1 Inter, sans-serif;">Editorial — numbered chapters, OS series picker, Live teaser</span>
      </div>
      <div style="width: 1440px; transform: translateZ(0); border-radius: 12px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.07);">
        <dc-import name="HomeEditorial" hint-size="1440px,4200px"></dc-import>
      </div>
    </div>
  </div>
</section>
</x-dc>
