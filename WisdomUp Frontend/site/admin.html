<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · WisdomUp Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/wu-logo.png">
<link rel="stylesheet" href="css/ds/tokens/fonts.css">
<link rel="stylesheet" href="css/ds/tokens/colors.css">
<link rel="stylesheet" href="css/ds/tokens/typography.css">
<link rel="stylesheet" href="css/ds/tokens/spacing.css">
<link rel="stylesheet" href="css/ds/tokens/base.css">
<link rel="stylesheet" href="css/ds/styles/components.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/info.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="adm">
  <header class="adm__bar">
    <img src="img/wu-logo.png" alt="WisdomUp" height="30">
    <b>Orders</b>
    <span class="adm__sp"></span>
    <button type="button" class="btn-outline" id="adm-refresh" hidden>Refresh</button>
    <button type="button" class="btn-outline" id="adm-out" hidden>Sign out</button>
  </header>

  <form class="adm__login" id="adm-login">
    <h1>Order admin</h1>
    <p>Enter the admin key to see orders. It is kept for this browser tab only.</p>
    <div class="field"><label for="adm-key">Admin key</label><input id="adm-key" type="password" autocomplete="current-password" required></div>
    <button type="submit" class="btn-navy">Show orders</button>
    <p class="adm__err" id="adm-err" role="alert" hidden></p>
  </form>

  <main class="adm__main" id="adm-main" hidden>
    <div class="adm__stats" id="adm-stats"></div>
    <div class="adm__tools">
      <div class="policy__links" id="adm-filter" role="group" aria-label="Filter by status"></div>
      <label class="hsearch adm__search"><input type="search" id="adm-q" placeholder="Search order, name, phone or city" aria-label="Search orders"></label>
    </div>
    <div class="adm__list" id="adm-list" aria-live="polite"></div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="js/shop.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
