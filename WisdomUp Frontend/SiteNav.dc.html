<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/tokens/colors.css">
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/tokens/typography.css">
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/tokens/base.css">
  <link rel="stylesheet" href="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/styles/components.css">
  <script src="_ds/wisdomup-design-system-ba770b81-2303-4bcc-8590-becfff5c0eff/_ds_bundle.js"></script>
</helmet>
<header class="nav" style="position: fixed; top: {{ top }}px; left: {{ inset }}; right: {{ inset }}; z-index: 40; height: {{ navH }}px; padding: 0 {{ padR }}px 0 {{ padL }}px; gap: {{ navGap }}px; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; isolation: isolate; border-radius: 999px; box-shadow: none; clip-path: inset(0 round 999px); transform: {{ shift }}; transition: transform 320ms cubic-bezier(.2,.7,.2,1);">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; border-radius: 999px; clip-path: inset(0 round 999px); overflow: hidden; background: rgba(190,192,194,.28); backdrop-filter: blur(44px) saturate(185%) brightness(1.02); -webkit-backdrop-filter: blur(44px) saturate(185%) brightness(1.02); pointer-events: none;"></div>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
  <a href="#" onClick="{{ logoClick }}" aria-label="WisdomUp home" style="display: flex; align-items: center; flex: none;">
    <img src="img/wu-logo.png" alt="WisdomUp" style="height: {{ logoH }}px; width: auto; display: block;">
  </a>
  <nav aria-label="Categories" style="flex: 1; display: flex; justify-content: center; align-items: center; gap: {{ gap }}px; min-width: 0; overflow: hidden;">
    <sc-for list="{{ items }}" as="c" hint-placeholder-count="8">
      <button class="navbtn" aria-expanded="{{ c.expanded }}" aria-label="{{ c.label }}" onClick="{{ c.pick }}" style="height: 50px; min-width: 50px;">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none; width: 31px; height: 31px;"><path d="{{ c.d }}" fill="#fff" fill-rule="evenodd"></path><path d="{{ c.s }}" fill="none" stroke="#fff" stroke-width="{{ c.w }}" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span>{{ c.label }}</span>
      </button>
    </sc-for>
  </nav>
  <div style="display: flex; align-items: center; gap: 8px; flex: none;">
    <button class="navbtn navbtn--all" onClick="{{ shopAll }}" style="height: 50px; min-width: 50px; padding: {{ allPad }}; gap: 8px; margin-right: {{ allMr }}px; font-weight: 500; font-size: 17px; background: rgba(150,150,150,.35);">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none; width: 29px; height: 29px;"><path d="M5.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 3.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM5.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15.5 13.5h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z" fill="#fff" fill-rule="evenodd"></path><path d="" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><span>Shop All</span></sc-if>
    </button>
    <button class="navbtn navbtn--util" aria-label="Search" onClick="{{ search }}" style="height: 50px; min-width: 50px;">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none; width: 29px; height: 29px;"><path d="" fill="#fff" fill-rule="evenodd"></path><path d="M11 4.5a6.5 6.5 0 1 1 0 13a6.5 6.5 0 1 1 0-13zM16 16l4.5 4.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><button class="navbtn navbtn--util" aria-label="Account" onClick="{{ account }}" style="height: 50px; min-width: 50px;">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none; width: 29px; height: 29px;"><path d="M12 2.5a4.3 4.3 0 1 1 0 8.6a4.3 4.3 0 1 1 0-8.6zM3.5 21.5a8.5 8.5 0 0 1 17 0z" fill="#fff" fill-rule="evenodd"></path><path d="" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button></sc-if>
    <button class="navbtn navbtn--util" aria-label="Cart" onClick="{{ bag }}" style="position: relative; height: 50px; min-width: 50px;">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="display: block; flex: none; width: 29px; height: 29px;"><path d="M5.2 8h13.6a1 1 0 0 1 1 1.1l-1 11a1.6 1.6 0 0 1-1.6 1.4H6.8a1.6 1.6 0 0 1-1.6-1.4l-1-11A1 1 0 0 1 5.2 8z" fill="#fff" fill-rule="evenodd"></path><path d="M8.8 8V6.5a3.2 3.2 0 0 1 6.4 0V8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
        <b style="position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent-red, #E3312D); color: #fff; font: 700 10px/16px var(--font); box-sizing: border-box;">{{ bagCount }}</b>
      </sc-if>
    </button>
  </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-width: 0;">
      <button type="button" aria-label="Menu" onClick="{{ menu }}" style="justify-self: start; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: #fff;">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"></path></svg>
      </button>
      <a href="#" onClick="{{ logoClick }}" aria-label="WisdomUp home" style="display: flex; align-items: center; justify-content: center;">
        <img src="img/wu-logo.png" alt="WisdomUp" style="height: 32px; width: auto; display: block;">
      </a>
      <div style="justify-self: end; display: flex; align-items: center; gap: 2px;">
        <button type="button" aria-label="Search" onClick="{{ search }}" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; cursor: pointer;">
          <svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.5a6.5 6.5 0 1 1 0 13a6.5 6.5 0 1 1 0-13zM16 16l4.5 4.5"></path></svg>
        </button>
        <button type="button" aria-label="Cart" onClick="{{ bag }}" style="position: relative; width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; cursor: pointer;">
          <svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 8h13.6a1 1 0 0 1 1 1.1l-1 11a1.6 1.6 0 0 1-1.6 1.4H6.8a1.6 1.6 0 0 1-1.6-1.4l-1-11A1 1 0 0 1 5.2 8zM8.8 8V6.5a3.2 3.2 0 0 1 6.4 0V8"></path></svg>
          <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
            <b style="position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--accent-red, #E3312D); color: #fff; font: 700 10px/16px var(--font); box-sizing: border-box;">{{ bagCount }}</b>
          </sc-if>
        </button>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | null&quot;},&quot;bagCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;startTop&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;onCategory&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(c, i) =&gt; void&quot;},&quot;onShopAll&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSearch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAccount&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onBag&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onLogo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const CATS = [ { "label": "Earbuds", "d": "M7.6 2.6a1.9 1.9 0 1 1 0 3.8a1.9 1.9 0 1 1 0-3.8zM7 5.5h1.3v4.3H7zM16.4 2.6a1.9 1.9 0 1 1 0 3.8a1.9 1.9 0 1 1 0-3.8zM15.7 5.5H17v4.3h-1.3zM3.5 11h17v4.5a6 6 0 0 1-6 6h-5a6 6 0 0 1-6-6zM11 15.6a1 1 0 1 0 2 0a1 1 0 1 0-2 0z", "s": "", "w": 2.2 }, { "label": "Headphones", "d": "M5 13h2a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 7 21H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2zM5.1 15.1h1.4v3.8H5.1zM17 13h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 17 13zM17.5 15.1h1.4v3.8h-1.4z", "s": "M4 15v-3a8 8 0 0 1 16 0v3", "w": 2.4 }, { "label": "Speakers", "d": "M8 2.5h8a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-15a2 2 0 0 1 2-2zM9.4 8a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0-5.2 0zM10.9 8a1.1 1.1 0 1 0 2.2 0a1.1 1.1 0 1 0-2.2 0zM9 15.5a3 3 0 1 0 6 0a3 3 0 1 0-6 0zM10.8 15.5a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0z", "s": "M3.6 8.6L2.2 7.8M3.6 12H2M3.6 15.4l-1.4.8M20.4 8.6l1.4-.8M20.4 12H22M20.4 15.4l1.4.8", "w": 1.4 }, {"label":"Neckbands","d":"M8 2.7a1.9 1.9 0 1 1 0 3.8a1.9 1.9 0 1 1 0-3.8zM7.3 6h1.4l.4 3.2H7.5zM16 2.7a1.9 1.9 0 1 1 0 3.8a1.9 1.9 0 1 1 0-3.8zM15.3 6h1.4l-.2 3.2h-1.6zM2.2 13.2Q5 17.2 10.6 19.7Q16.6 21.6 20.3 15.6A1.3 1.3 0 0 0 18.1 14.4Q15.8 18.4 11.4 17.3Q7 15 4.2 11.8A1.3 1.3 0 0 0 2.2 13.2Z","s":"M8.3 9.2c.3 2.6.1 4-.9 5.6M15.7 9.2c.4 3 .5 5.6.3 8.4","w":1.1}, { "label": "Handsfree", "d": "M8 5.8a2.4 2.4 0 1 1 0 4.8a2.4 2.4 0 1 1 0-4.8zM16 3.4a2.4 2.4 0 1 1 0 4.8a2.4 2.4 0 1 1 0-4.8z", "s": "M8 10.6V22M16 8.2V22", "w": 1.6 }, { "label": "Smart Watches", "d": "M9 6h6a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3zM8.8 5.4l.7-3h5l.7 3zM8.8 18.6l.7 3h5l.7-3zM18.6 10h1v2.6h-1z", "s": "", "w": 2.2 }, { "label": "Power Banks", "d": "M8 2h8a2.5 2.5 0 0 1 2.5 2.5v15A2.5 2.5 0 0 1 16 22H8a2.5 2.5 0 0 1-2.5-2.5v-15A2.5 2.5 0 0 1 8 2zM13 5.5l-3.3 5h2.6l-1.3 4l3.3-5h-2.6zM8.5 17.6h7v1.4h-7z", "s": "", "w": 2.2 }, { "label": "Chargers", "d": "M7 9h10a1.5 1.5 0 0 1 1.5 1.5V20a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9.5A1.5 1.5 0 0 1 7 9zM12.8 12l-2.6 4h2l-1 3.2l2.6-4h-2zM9 2.5h1.4V9H9zM13.6 2.5H15V9h-1.4z", "s": "", "w": 2.2 }, { "label": "Cables", "d": "M15 4h4.5a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H15zM20.5 4.8h2v1.4h-2zM4.5 17H9v3H4.5a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1zM1.5 17.8h2v1.4h-2z", "s": "M15 5.5H7a3.2 3.2 0 0 0 0 6.4h10a3.2 3.2 0 0 1 0 6.4H9", "w": 2 }, { "label": "Microphones", "d": "M12 2a3.2 3.2 0 0 1 3.2 3.2v6.1a3.2 3.2 0 0 1-6.4 0V5.2A3.2 3.2 0 0 1 12 2z", "s": "M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v4M8.5 21.5h7", "w": 2 }, { "label": "Smart Home", "d": "M12 1.5a10.5 10.5 0 1 1 0 21a10.5 10.5 0 1 1 0-21zM12 2.9a9.1 9.1 0 1 0 0 18.2a9.1 9.1 0 1 0 0-18.2zM12 3.9a8.1 8.1 0 1 1 0 16.2a8.1 8.1 0 1 1 0-16.2zM12 15a1.4 1.4 0 1 0 0 2.8a1.4 1.4 0 1 0 0-2.8z", "s": "", "w": 2.2 }, { "label": "USB Cables", "d": "M8 1.5h5v5H8zM9.3 2.8h.9v.9h-.9zM10.8 2.8h.9v.9h-.9zM7.5 6.5h6v3h-6z", "s": "M10.5 9.5v8a2.5 2.5 0 0 0 5 0V12a2.5 2.5 0 0 1 5 0v10", "w": 1.8 } ];

class Component extends DCLogic {
  state = { y: 0, w: typeof window !== 'undefined' ? window.innerWidth : 1440, hidden: false };
  componentDidMount() {
    this._last = window.scrollY;
    this._s = () => {
      const an = document.querySelector('[data-nav-anchor]');
      const at = an ? an.getBoundingClientRect().top : null;
      const y = window.scrollY, d = y - this._last;
      let hidden = this.state.hidden;
      if (y < 120) hidden = false;
      else if (d > 6) hidden = true;
      else if (d < -6) hidden = false;
      if (Math.abs(d) > 6 || y < 120) this._last = y;
      if (hidden !== this.state.hidden) window.dispatchEvent(new CustomEvent('wu-nav', { detail: { hidden } }));
      this.setState({ y, at, w: window.innerWidth, hidden });
    };
    window.addEventListener('scroll', this._s, { passive: true });
    window.addEventListener('resize', this._s);
    this._s();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._s); window.removeEventListener('resize', this._s); }
  renderVals() {
    const p = this.props;
    const start = p.startTop ?? 20;
    const active = p.active ?? null;
    const bagCount = p.bagCount ?? 0;
    const call = (fn, ...a) => e => { if (e && e.preventDefault) e.preventDefault(); fn && fn(...a); };
    const w = this.state.w;
    const count = w >= 1560 ? 12 : w >= 1420 ? 10 : w >= 1240 ? 8 : w >= 1080 ? 6 : w >= 940 ? 4 : 0;
    return {
      gap: w >= 1360 ? 13 : 5,
      wide: w >= 640,
      narrow: w < 640,
      menu: call(p.onMenu || p.onShopAll),
      inset: w >= 640 ? 'calc(var(--gutter, 28px) + 20px)' : 'calc(var(--gutter, 16px) + 10px)',
      navH: w >= 640 ? 70 : 54,
      padL: w >= 640 ? 34 : 6,
      padR: w >= 640 ? 10 : 6,
      navGap: w >= 640 ? 34 : 0,
      logoH: w >= 640 ? 43 : 34,
      allPad: w >= 640 ? '0 21px 0 13px' : '0',
      allMr: w >= 640 ? 5 : 0,
      top: w < 640 && this.state.at != null ? Math.max(10, this.state.at + 10) : Math.max(16, start - this.state.y),
      shift: this.state.hidden ? 'translateY(calc(-100% - 40px))' : 'none',
      items: CATS.slice(0, count).map((c, i) => ({ ...c, expanded: c.label === active ? 'true' : 'false', pick: call(p.onCategory, c, i) })),
      shopAll: call(p.onShopAll), search: call(p.onSearch), account: call(p.onAccount), bag: call(p.onBag), logoClick: call(p.onLogo),
      bagCount, hasBadge: bagCount > 0,
    };
  }
}
</script>
</body>
</html>
